; Godot export presets — Sound Clash Brawl.
;
; "Web" is the Chromebook playtest build: a single-threaded (no SharedArrayBuffer,
; so no COOP/COEP headers needed) GL Compatibility / WebGL2 export. It is exported
; into the repository-root /docs folder so GitHub Pages or any static server can
; serve it.
;
; PART 3 commit 8: VRAM compression is ON for both targets, because the delivered
; jamaican_speaker.glb albedo is imported as VRAM-compressed (2048px, mipmapped).
; That adds the S3TC variant desktop Chrome (incl. Intel Chromebooks) uses and the
; ETC2/ASTC variant iPhone Safari's WebGL2 uses. The fighters' and crowd's own
; albedos stay lossless, so this only affects the one VRAM-compressed prop texture.
;
; Usage (headless, no editor needed):
;   godot --headless --path godot --import
;   godot --headless --path godot --export-release "Web" docs/index.html
[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="assets/sprites/feedback/imported-poses/*,assets/sprites/feedback/aligned/08_block.png,assets/sprites/feedback/aligned/15_skank.png,assets/sprites/feedback/selected-frames-2026-11-15/skank/06.png,assets/sprites/lickshot/_archive/*"
export_path="../docs/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
