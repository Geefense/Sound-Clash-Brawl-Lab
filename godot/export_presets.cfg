; Godot export presets — Sound Clash Brawl.
;
; "Web" is the Chromebook playtest build: a single-threaded (no SharedArrayBuffer,
; so no COOP/COEP headers needed) GL Compatibility / WebGL2 export. It is exported
; into the repository-root /docs folder so GitHub Pages or any static server can
; serve it.
;
; PART 3 commit 8: VRAM compression is ON for both targets, because the delivered
; jamaican_speaker.glb albedo is imported as VRAM-compressed (2048px, mipmapped).
; That adds the S3TC variant desktop Chrome (incl. Intel Chromebooks) uses and the
; ETC2/ASTC variant iPhone Safari's WebGL2 uses. The fighters' and crowd's own
; albedos stay lossless, so this only affects the one VRAM-compressed prop texture.
;
; PART C commit 8 (2026-11-26) — pack slimming, measured against the built pack:
;   * exclude_filter now also drops the archived fighter uploads that are not selectable
;     (feedback_fitted_jacket_albedo.jpg 4.9 MB, feedback_v2.fbx, feedback_fighting_idle_rigged.fbx,
;     lickshot.fbx, lickshot_placeholder_static.fbx, likkle_moore.fbx), the 13 crowd atlas
;     pages no material references (each crowd model's _2/_3.png), the QA contact sheet and
;     the tools/ harnesses. Every remaining `_0.png` stays: CharacterModelSlots loads it by
;     path as the delivered atlas even when the imported material has no albedo.
;   * the three `*_rigged_0.png` model textures import at 64 px (process/size_limit=64):
;     FighterModel3D replaces every surface material with the graded `*_albedo.png` at build
;     time, so the upload's own texture is never sampled. Nothing else was downscaled; the
;     speaker's 2048 atlas, both its S3TC and ETC2/ASTC variants and every 512 sprite frame
;     are untouched.
;
; Usage (headless, no editor needed):
;   godot --headless --path godot --import
;   godot --headless --path godot --export-release "Web" docs/index.html
[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="assets/models/crowd/*,assets/sprites/feedback/imported-poses/*,assets/sprites/feedback/aligned/08_block.png,assets/sprites/feedback/aligned/15_skank.png,assets/sprites/feedback/selected-frames-2026-11-15/skank/06.png,assets/sprites/lickshot/_archive/*,assets/models/fighters/feedback_fitted_jacket_albedo.jpg,assets/models/fighters/feedback_fighting_idle_rigged.fbx,assets/models/fighters/feedback_v2.fbx,assets/models/fighters/lickshot.fbx,assets/models/fighters/lickshot_placeholder_static.fbx,assets/models/fighters/likkle_moore.fbx,tools/*,qa/*,assets/models/dj/Crowd Male Rallying_2.png,assets/models/dj/Crowd Male Cheering_2.png,assets/models/crowd/Crowd Male Rallying_2.png,assets/models/crowd/Crowd Male Cheering_2.png,assets/models/crowd/Crowd Male Angry Gesture_2.png,assets/models/crowd/Crowd female Hip Hop Dancing_2.png,assets/models/crowd/Crowd female Hip Hop Dancing_3.png,assets/models/crowd/Crowd female Snake Hip Hop Dance_2.png,assets/models/crowd/Crowd female Snake Hip Hop Dance_3.png,assets/models/crowd/Crowd female Dancing Twerk_2.png,assets/models/crowd/Crowd female Dancing Twerk_3.png,assets/models/crowd/Crowd female Moonwalk_2.png,assets/models/crowd/Crowd female Moonwalk_3.png"
export_path="../docs/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
